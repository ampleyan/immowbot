services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - IMMOWBOT_TRUSTED_IPS=${IMMOWBOT_TRUSTED_IPS}
      - IMMOWBOT_INVITE_TOKEN=${IMMOWBOT_INVITE_TOKEN}
      - IMMOWBOT_AUTH_SECRET=${IMMOWBOT_AUTH_SECRET}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
