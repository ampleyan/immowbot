services:
  app:
    build: .
    ports:
      - "666:8000"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - IMMOWBOT_INVITE_TOKEN=${IMMOWBOT_INVITE_TOKEN}
      - IMMOWBOT_AUTH_SECRET=${IMMOWBOT_AUTH_SECRET}
      - DATABASE_MODE=${DATABASE_MODE}
      - DATABASE_DSN=${DATABASE_DSN}
      - TRUSTED_IPS=${TRUSTED_IPS:-127.0.0.1,::1,169.224.189.199}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
