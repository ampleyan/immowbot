services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: immowbot_test
      POSTGRES_USER: immowbot_test
      POSTGRES_PASSWORD: immowbot_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immowbot_test -d immowbot_test"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
