name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write env file
        run: |
          cat > .env << EOF
          IMMOWBOT_TRUSTED_IPS=${{ secrets.IMMOWBOT_TRUSTED_IPS }}
          IMMOWBOT_INVITE_TOKEN=${{ secrets.IMMOWBOT_INVITE_TOKEN }}
          IMMOWBOT_AUTH_SECRET=${{ secrets.IMMOWBOT_AUTH_SECRET }}
          EOF

      - name: Deploy
        run: docker compose up -d --build
