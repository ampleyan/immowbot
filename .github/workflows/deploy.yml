name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Repair workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v5

      - name: Write env file
        run: |
          cat > .env << EOF
          IMMOWBOT_INVITE_TOKEN=${{ secrets.IMMOWBOT_INVITE_TOKEN }}
          IMMOWBOT_AUTH_SECRET=${{ secrets.IMMOWBOT_AUTH_SECRET }}
          EOF

      - name: Deploy
        run: docker compose up -d --build
