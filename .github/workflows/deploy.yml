name: Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Repair workspace ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Preserve persistent runtime settings
        run: |
          runtime_settings="$GITHUB_WORKSPACE/data/runtime-settings.json"
          preserved_settings="$RUNNER_TEMP/immowbot-runtime-settings.json"
          if [ -f "$runtime_settings" ]; then
            install -m 600 "$runtime_settings" "$preserved_settings"
            echo "IMMOWBOT_RUNTIME_SETTINGS_PRESERVED=true" >> "$GITHUB_ENV"
          else
            echo "IMMOWBOT_RUNTIME_SETTINGS_PRESERVED=false" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v5

      - name: Restore persistent runtime settings
        if: env.IMMOWBOT_RUNTIME_SETTINGS_PRESERVED == 'true'
        run: install -m 600 "$RUNNER_TEMP/immowbot-runtime-settings.json" "$GITHUB_WORKSPACE/data/runtime-settings.json"

      - name: Write env file
        run: |
          cat > .env << EOF
          IMMOWBOT_INVITE_TOKEN=${{ secrets.IMMOWBOT_INVITE_TOKEN }}
          IMMOWBOT_AUTH_SECRET=${{ secrets.IMMOWBOT_AUTH_SECRET }}
          EOF

      - name: Deploy
        run: docker compose up -d --build
