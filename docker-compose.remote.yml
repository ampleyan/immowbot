services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${LOCAL_APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ${DATABASE_CERT_DIR:-./certs}:/run/immowbot/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      IMMOWBOT_INVITE_TOKEN: ${IMMOWBOT_INVITE_TOKEN}
      IMMOWBOT_AUTH_SECRET: ${IMMOWBOT_AUTH_SECRET}
      TRUSTED_IPS: ${TRUSTED_IPS:-127.0.0.1,::1}
      DATABASE_MODE: remote
      DATABASE_DSN: ${DATABASE_DSN:?DATABASE_DSN must be set}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
